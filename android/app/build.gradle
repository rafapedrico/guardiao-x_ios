plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Assinatura de release (upload key da Play Store) — lida de android/key.properties,
// arquivo fora do git (ver android/.gitignore) contendo a senha real da keystore.
// Em CI/máquinas sem esse arquivo, o build de release simplesmente cai de volta
// para a assinatura debug (mesmo comportamento de antes desta config existir),
// nunca falha o build por falta dele.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.security_check_app"
    // Fixado em 36 (em vez de flutter.compileSdkVersion) — 35 atendia o
    // requisito mínimo do plugin audioplayers; o requisito de 36 vinha do
    // flutter_secure_storage (dependência transitiva do
    // flutter_facebook_auth, removido em 2026-08-23). NÃO baixado de
    // volta por precaução — nunca confirmado se nenhuma outra dependência
    // já passou a depender de 36 nesse meio tempo; baixar sem checar isso
    // é mais risco do que vale a pena.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Exigido pelo flutter_local_notifications sob o AGP 8.7 (ver
        // erro de build "requires core library desugaring to be enabled")
        // — habilita o backport de APIs Java 8+ (java.time etc.) para o
        // minSdk 23 deste app.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Pacote definitivo de produção, registrado na Play Store e no
        // Firebase (novo Android app "Guardião X (Android)" criado em
        // 2026-08-16, appId 1:555863351772:android:f8cdca1bbe926aa74def19)
        // — NUNCA mais pode mudar depois da primeira publicação na loja.
        applicationId = "com.rmfglobal.guardiaox"
        // Fixado em 23 (em vez de flutter.minSdkVersion, que resolvia 21)
        // — exigido pelo flutter_secure_storage (dependência transitiva do
        // flutter_facebook_auth, removido em 2026-08-23; ver comentário do
        // compileSdk acima sobre não baixar isso de volta sem checar).
        // Único efeito colateral: o app deixa de instalar em Android
        // 5.0/5.1 (API 21-22).
        minSdkVersion = flutter.minSdkVersion
        // CORREÇÃO (2026-08-14): este valor tinha ficado divergente do
        // próprio comentário original ("acompanhar o compileSdk acima") —
        // estava fixo em 35 enquanto compileSdk já é 36. Um targetSdk
        // abaixo da versão de plataforma do aparelho é exatamente o que
        // faz o Android exibir o aviso nativo "Este app não é compatível
        // com a versão mais recente do Android" (reportado em um Motorola
        // Razr 40 Ultra rodando Android 16/API 36). Corrigido para 36,
        // igual ao compileSdk, como o comentário sempre pretendeu.
        targetSdk = 36

        // Lidos do pubspec.yaml (campo "version: X.Y.Z+N") pelo próprio
        // Flutter Gradle Plugin — nunca mais precisam ser tocados aqui
        // manualmente; bastar bumpar o pubspec.yaml a cada release.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Usa a upload key real (android/key.properties) quando
            // disponível; senão cai de volta para a debug key, mesmo
            // comportamento de antes desta config existir.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Mesmo helper usado internamente pelo plugin firebase_core (ver
// firebase_core/android/build.gradle) para resolver a versão do Firebase
// BOM configurada pelo tooling do FlutterFire — replicado aqui em vez de
// fixar uma versão manualmente, para a dependência abaixo (necessária ao
// SolicitacaoMonitoramentoFcmReceiver, que usa RemoteMessage diretamente)
// nunca ficar dessincronizada da versão que o resto do app já usa.
def getRootProjectExtOrDefaultProperty(name) {
    if (!rootProject.ext.has("FlutterFire")) return project.properties[name]
    if (!rootProject.ext.get("FlutterFire")[name]) return project.properties[name]
    return rootProject.ext.get("FlutterFire").get(name)
}

dependencies {
    // Necessária para NotificationCompat.Builder usado pelo VolumeSosService
    // (Foreground Service persistente do gatilho físico de SOS).
    implementation "androidx.core:core-ktx:1.13.1"
    // Tema AppCompat exigido pelo local_auth (BiometricPrompt) no Android 8
    // e anteriores — ver res/values*/styles.xml.
    implementation "androidx.appcompat:appcompat:1.7.0"
    // Required for PreferenceManager
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Necessária para RemoteMessage em SolicitacaoMonitoramentoFcmReceiver
    // (interceptação nativa do broadcast do FCM, ver essa classe).
    implementation platform("com.google.firebase:firebase-bom:${getRootProjectExtOrDefaultProperty("FirebaseSDKVersion")}")
    implementation "com.google.firebase:firebase-messaging"
    // Usada por VolumeSosBootReceiver/VolumeSosBootWorker para reiniciar o
    // VolumeSosService (FGS "specialUse") em background, fora do contexto
    // síncrono do broadcast BOOT_COMPLETED — ver comentário em
    // VolumeSosBootReceiver sobre a restrição do Android 15/API 35.
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    // Ver comentário em compileOptions/coreLibraryDesugaringEnabled acima.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source = "../.."
}
