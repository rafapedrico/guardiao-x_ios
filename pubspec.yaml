name: security_check_app
description: A security check application for personal safety.
publish_to: 'none'
version: 1.0.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Internacionalização (i18n/l10n) - Português/Inglês/Espanhol
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Firebase — projeto real "guardiaox" já configurado (ver
  # android/app/google-services.json). firebase_auth ativado (login/cadastro
  # reais por e-mail/senha, ver lib/services/firebase_auth_service.dart, e
  # login social Google/Apple, ver
  # lib/services/social_auth_service.dart). firebase_messaging ativado para
  # o Push App-para-App de alerta híbrido (ver lib/services/fcm_service.dart)
  # e cloud_functions para as chamadas callable da aba Monitoramento (ver
  # lib/services/monitoramento_service.dart).
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.9.4
  cloud_functions: ^4.7.6
  # CORREÇÃO (bug real diagnosticado em teste, 2026-08-10): login
  # travando indefinidamente, sem erro, tanto e-mail/senha quanto
  # social. Sem NENHUM provedor de App Check ativado, o interceptor de
  # rede que o próprio SDK (firebase_auth/firebase_core) injeta em toda
  # chamada ficava tentando obter um token de um provedor inexistente e
  # nunca completava a chamada — nem sucesso, nem exceção, só um
  # `Future` pendurado para sempre (confirmado via logcat: o log do
  # próprio SDK "Error getting App Check token; using placeholder token
  # instead" aparecia, mas a chamada JAMAIS retornava depois disso).
  # Versão 0.2.x é a faixa compatível com firebase_core ^2.32.0 (ver
  # lib/main.dart, `_iniciarFirebaseEAuth`, para a ativação).
  firebase_app_check: ^0.2.1+22

  # google_sign_in ^7.x — CORREÇÃO (mesmo bug real acima): a 6.2.2 usa a
  # API "clássica" (legacy) do Google, que o próprio SDK nativo já
  # acusa como descontinuada em runtime ("Please migrate to the
  # Credential Manager APIs") — na prática, travava indefinidamente
  # após obter o token nativo com sucesso, sem nunca completar nem
  # lançar exceção do lado Dart (confirmado via logcat: só o Google
  # especificamente e e-mail/senha — mesmo caminho de Firebase Auth —
  # continuaram funcionando normalmente). A 7.x reescreve a API por
  # completo (singleton `GoogleSignIn.instance`, `initialize()`
  # obrigatório antes de qualquer outra chamada, `authenticate()` no
  # lugar de `signIn()`) — ver `social_auth_service.dart`.
  google_sign_in: ^7.2.0

  # Login social Apple (ver lib/services/social_auth_service.dart) —
  # Facebook removido em 2026-08-23 (decisão de arquitetura). Versão
  # travada na major mais recente ainda compatível com firebase_auth
  # ^4.16.0 (subir pra firebase_auth 6.x seria uma migração maior, fora
  # do escopo deste recurso; `flutter pub outdated` mostra as versões
  # mais novas incompatíveis).
  sign_in_with_apple: ^7.0.1

  # Consulta o preço REAL da assinatura mensal do Plano Premium
  # diretamente da loja (Google Play Billing/App Store) — ver
  # lib/services/premium_price_service.dart. NÃO relacionado à antiga
  # Carteira de Créditos (removida em 2026-08-11 junto com o WhatsApp de
  # contingência que ela financiava).
  in_app_purchase: ^3.2.0
  # Dependência transitiva de in_app_purchase (implementação Android) —
  # declarada aqui de forma direta porque PremiumPurchaseService importa
  # GooglePlayPurchaseParam diretamente (necessário para amarrar a compra
  # ao uid via `applicationUserName`/obfuscatedAccountId, ver
  # `lib/services/premium_purchase_service.dart`).
  in_app_purchase_android: ^0.5.2
  # Migração iOS (Fase 5, 2026-09-12): gera o `appAccountToken` (UUID v5
  # determinístico a partir do uid do Firebase, ver
  # `lib/services/premium_purchase_service.dart` e a MESMA derivação em
  # `functions/premiumPurchaseService.js`) exigido pelo StoreKit 2 para
  # amarrar a compra ao usuário — o iOS descarta silenciosamente uma
  # string arbitrária (como o uid puro) nesse campo, precisa ser um UUID
  # de verdade.
  uuid: ^4.6.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Networking & GPS
  http: ^1.1.2
  geolocator: ^10.1.0

  # UI
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.3
  font_awesome_flutter: ^11.0.0

  # Contatos e permissões (Contatos de Emergência - aba Família)
  flutter_contacts: ^2.5.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5

  # Alarmes em segundo plano e notificações locais
  android_alarm_manager_plus: ^4.0.3
  flutter_local_notifications: ^19.5.0
  # Migração iOS (2026-09-12): `zonedSchedule` (lembrete de check-in de
  # rotina agendado, ver NotificacaoService/RotinaAlarmeService) exige o
  # banco de fusos horários deste pacote — já era dependência transitiva
  # do flutter_local_notifications, declarada aqui de forma direta porque
  # passa a ser importada diretamente também. Não usado no Android (que
  # continua 100% no android_alarm_manager_plus).
  timezone: ^0.10.1

  # Alerta Sonoro Customizável (Etapa 1 - Expansão Global)
  audioplayers: ^6.1.0

  # Recurso de Captura e Dissuasão: câmera traseira em tela cheia
  # Fixado em 0.10.5+9 (em vez de 0.11.x) para evitar a dependência
  # transitiva camera_android_camerax mais recente, que exige uma API
  # SurfaceProducer.Callback incompatível com a versão do Flutter/Gradle
  # local usada neste projeto.
  camera: 0.10.5+9
  phone_numbers_parser: ^9.0.25
  firebase_storage: ^11.7.7
  gal: 2.3.3
  share_plus: ^10.0.0
  path_provider: ^2.1.5

  # (app_links removido no build 110: o toque no Widget SOS,
  # guardiaox://sos, é capturado nativamente no ios/Runner/SceneDelegate.swift
  # — ver lib/services/sos_deep_link_service.dart.)
  local_auth: ^3.0.2



dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/sounds/
    - assets/lang/
    - assets/images/

# Ícone do aplicativo (App Launcher Icon) — gerado via
# `dart run flutter_launcher_icons`, ver assets/images/app_icon.png (logo
# "GX" do Guardião-X). Android: ícone padrão + ícone adaptativo, com fundo
# sólido grafite combinando com o escudo do ícone. iOS: AppIcon.appiconset,
# com `remove_alpha_ios` porque a App Store recusa o ícone 1024x1024 com
# canal alfa (transparência).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#12131C"
  adaptive_icon_foreground: "assets/images/app_icon.png"

