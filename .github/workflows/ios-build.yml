name: iOS Build Validation

# Este projeto Flutter vive na RAIZ do repositório (pubspec.yaml e ios/ estão
# em ".", não em uma subpasta "dev/guardião-x_ios" dentro do próprio repo —
# esse caminho é onde o repo mora na máquina local). Por isso os passos abaixo
# não usam `working-directory`: o checkout já entrega o projeto no lugar certo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze & Build iOS (no codesign)
    runs-on: macos-latest
    # 30min estourava: a build principal (Pods dependendo de Firebase) já
    # leva ~15-20min sozinha, e o passo de diagnóstico (só roda em falha)
    # refaz a build inteira do zero via xcodebuild direto — juntos passam
    # de 30min facilmente à medida que os fixes desbloqueiam mais
    # compilação a cada rodada (2026-09-13, run 34768128514 cancelada no
    # limite, no meio do diagnóstico, sem gerar log útil).
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      # --no-fatal-warnings: o repo hoje tem alguns warnings pré-existentes
      # de código morto (métodos/campos não usados) que não são erros de
      # verdade e não travam a compilação — decisão deliberada (2026-09-13)
      # para não bloquear o CI por lint debt que precisa de triagem manual
      # (pode ser feature incompleta, não necessariamente lixo). Ajustar
      # para --fatal-warnings depois de limpar esse débito.
      - name: Static analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests (flutter test)
        run: flutter test

      # ios/Podfile já é versionado (desde o fix de deployment target/flag
      # -G). `flutter build ios` roda o `pod install` internamente antes de
      # compilar — por isso não há um passo separado de "pod install" aqui.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      # DIAGNÓSTICO (só roda se o passo acima falhar): `flutter build ios`
      # mostra só um resumo curado do erro (extraído de um .xcresult
      # temporário que o próprio Flutter apaga depois) — não dá pra ver de
      # qual pod/arquivo uma flag de compilador problemática (ex: o "-G"
      # que já bateu aqui 3x seguidas) realmente veio. Este passo refaz a
      # build chamando o xcodebuild DIRETO (mesmo workspace/scheme que o
      # Flutter usa, Pods já instalados pelo passo anterior), capturando o
      # log bruto e imprimindo o trecho ao redor de qualquer "-G" — a linha
      # de "CompileC" que aparece um pouco acima revela o pod/arquivo exato.
      - name: Diagnóstico — log bruto do xcodebuild (só em falha)
        if: failure()
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild_raw.log" || true

          echo "::group::Trecho ao redor de qualquer '-G' encontrado no log bruto"
          grep -n -B 20 -A 5 -- '-G' "$RUNNER_TEMP/xcodebuild_raw.log" \
            || echo "Nenhuma ocorrência literal de '-G' no log bruto (pode ter sido corrigida, ou o erro real é outro — ver artifact completo)."
          echo "::endgroup::"

      - name: Diagnóstico — upload do log bruto completo (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-raw-log
          path: ${{ runner.temp }}/xcodebuild_raw.log
          retention-days: 7
          if-no-files-found: ignore
